<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Objetivos 2027 ITCA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: tablero de control con la estética de itca.com.ar — azul noche, verde menta, fucsia de acento */
:root{
  --bg:#020A3D; --panel:#0A1458; --ink:#FFFFFF; --muted:#AEB8E6; --line:#26338A; --line-soft:#152070;
  --accent:#3EE39A; --accent-soft:#12406A; --target:#F0459F; --target-soft:#3B1458;
  --ok:#3EE39A; --ok-soft:#0F3F55; --warn:#FFC94A; --warn-soft:#3D3550; --bad:#FF5C77; --bad-soft:#47184F;
  --s4:#A784F0; --s6:#3CC0CC; --s8:#EC7AB8; --navy:#020A3D;
  --c-consti:#4FB3FF; --c-congreso:#A98BFF; --c-oeste:#2FD4CF; --c-beiro:#FF6FC0; --c-sanisidro:#FF9B4A; --c-banfield:#8BE05A; --c-central:#7C8CFF;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1}
.brand small{color:var(--muted);font-size:14px}
.brand .clock{font-weight:500;color:var(--ink);opacity:.75}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1 0 100%;justify-content:center}
nav.tabs{gap:10px;padding-block:6px 4px}
nav.tabs a{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:10px 24px;border-radius:8px;border:2px solid var(--ink);background:var(--panel);box-shadow:0 2px 0 var(--line);transition:background .15s,color .15s}
nav.tabs a:hover{background:var(--line-soft)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);box-shadow:none}
@media (max-width:480px){nav.tabs a{padding:9px 14px;font-size:16px}}
.months{display:flex;gap:4px;overflow-x:auto;padding-block:4px 10px;scrollbar-width:thin}
.months button{flex:0 0 auto;font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 12px;cursor:pointer;position:relative}
.months button.has::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.months button.hoy{border-color:var(--target);color:var(--target)}
.months button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.months button.more{letter-spacing:.12em;font-weight:700;color:var(--ink)}
.months .msep{flex:0 0 1px;background:var(--line);margin:4px 4px}
.months .mhint{flex:0 0 auto;align-self:center;font-size:12px;color:var(--muted);padding-left:8px;white-space:nowrap}
table.heat td{font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:baseline;flex:0 0 auto}
.sede-h h3 .sw{width:12px;height:12px}
.sede .bar i{background:var(--sc)}
.sede.simple{display:grid;grid-template-columns:minmax(190px,.9fr) minmax(0,3fr) minmax(130px,.8fr);gap:12px 28px;align-items:center}
.s-name{display:flex;align-items:center;gap:4px;min-width:0}
.s-name h3{font-size:22px}
.s-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.s-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.s-badge{display:inline-block;font:700 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:6px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.s-badge.ok{background:var(--ok);color:#fff} .s-badge.warn{background:var(--warn);color:#fff} .s-badge.bad{background:var(--bad);color:#fff}
.s-say{font-size:16px;color:var(--ink)} .s-say b{font-weight:700}
.s-bar{padding-top:20px}
.s-track{position:relative;height:18px;border-radius:9px;background:color-mix(in srgb,var(--sc) 18%,var(--panel))}
.s-track i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--sc)}
.s-track u{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--target);border-radius:2px}
.s-track em{position:absolute;top:-22px;transform:translateX(-50%);font:600 12px var(--f-body);font-style:normal;color:var(--target);white-space:nowrap}
.s-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.s-sub{font-size:13.5px;color:var(--muted)} .s-sub b{color:var(--ink)}
.s-need{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.s-big{font:700 40px/1 var(--f-display);color:var(--ink)} .s-big.ok{color:var(--ok)} .s-big.bad{color:var(--bad)}
.s-cap{font-size:13.5px;color:var(--muted);line-height:1.35} .s-cap b{color:var(--ink)}
@media (max-width:820px){.sede.simple{grid-template-columns:1fr auto}.s-main{grid-column:1/-1;grid-row:2}}
.headline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-radius:10px;background:var(--panel);border:2px solid var(--line);margin-bottom:18px}
.headline.ok{border-color:var(--ok)} .headline.warn{border-color:var(--warn)} .headline.bad{border-color:var(--bad)}
.headline p{margin:0;font-size:19px;line-height:1.4}
.headline .s-badge{font-size:16px;padding:9px 14px}
.gauge{display:flex;align-items:center;gap:14px;min-width:0}
.gauge .ring{width:76px;height:76px;flex:0 0 76px;overflow:visible}
.gtxt{min-width:0;display:flex;flex-direction:column;gap:1px}
.glbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gval b{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.05;color:var(--ink)}
.gval span{color:var(--muted);font-size:14px}
.gmsg{font-size:13.5px;font-weight:600;color:var(--muted)}
.gmsg.ok{color:var(--ok)} .gmsg.warn{color:var(--warn)} .gmsg.bad{color:var(--bad)}
.gsub{font-size:12.5px;color:var(--muted)}
.sede .foot .big2{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;color:var(--ink)}
.sede .foot .big2.ok{color:var(--ok)}
.sede .foot .cap{font-size:13px;color:var(--muted);line-height:1.35}
.sede .foot .cap b{color:var(--ink)}
.convpill{margin-top:8px;font-size:13px;padding:4px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.convpill b{color:var(--ink)} .convpill.ok span{color:var(--ok);font-weight:600} .convpill.bad span{color:var(--bad);font-weight:600}
.seg button[data-tsede="TODAS"]{background:#000;color:#fff}
.months button[data-todos]{background:#000;border-color:#000;color:#fff}
.months button[data-todos][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--target)}
.seg button[data-tsede="TODAS"][aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--target)}
.sede.panel{background:color-mix(in srgb,var(--sc) 9%,var(--panel));border-color:color-mix(in srgb,var(--sc) 40%,var(--line))}
.sede .bar{background:color-mix(in srgb,var(--sc) 18%,var(--panel))}
table.heat td.h-ok{color:var(--ok)} table.heat td.h-warn{color:var(--warn)} table.heat td.h-bad{color:var(--bad)}
table.mx tr.sc > *{background:color-mix(in srgb,var(--sc) 16%,var(--panel));border-bottom-color:color-mix(in srgb,var(--sc) 30%,var(--panel))}
table.mx tr.sc th[scope="row"]{color:var(--ink);font-weight:600}
table.mx.sc thead th{background:color-mix(in srgb,var(--sc) 30%,var(--panel))}
table.mx.sc tbody th,table.mx.sc tbody td{background:color-mix(in srgb,var(--sc) 9%,var(--panel));border-bottom-color:color-mix(in srgb,var(--sc) 22%,var(--panel))}
table.mx.sc tr.real > *{background:color-mix(in srgb,var(--sc) 20%,var(--panel))}
table.mx.bw thead th{background:#fff;color:#000;border-bottom:2px solid #000}
table.mx.bw tbody th,table.mx.bw tbody td{background:#fff;color:#000;border-bottom-color:#DADADA}
table.mx.bw tr.real > *{background:#F1F1F1;color:#000}
table.mx.bw td.na{color:#9A9A9A}
table.mx tr.sc.bw > *{background:#fff;color:#000;border-top:2px solid #000;border-bottom-color:#000}
table.mx tr.sc.bw th[scope="row"]{color:#000;font-weight:700}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:.02em}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:12px}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kpi .lbl{font:700 17px/1.1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;color:var(--bg);background:var(--ink);align-self:flex-start;padding:7px 12px;border-radius:6px}
.kpi .big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .big span{font-size:22px;color:var(--muted);font-weight:500}
.kpi .sub{font-size:14px;color:var(--muted)}
.kpi .sub b{color:var(--ink);font-weight:600}

/* barra de progreso con marca de ritmo */
.bar{position:relative;height:10px;border-radius:5px;background:var(--line-soft);overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent);max-width:100%}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--target);border-radius:1px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--line-soft);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}

/* sedes */
.sedes{display:flex;flex-direction:column;gap:10px}
.sede{padding:14px 18px;display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(170px,.9fr);align-items:center;gap:12px 32px;min-width:0}
.sede .sede-h{flex-direction:column;align-items:flex-start;gap:6px}
.sede .foot{border-top:0;padding-top:0;flex-direction:column;align-items:flex-end;text-align:right;gap:2px}
@media (max-width:900px){.sede{grid-template-columns:1fr 1fr}.sede .foot{align-items:flex-start;text-align:left}}
@media (max-width:520px){.sede{grid-template-columns:1fr}}
.sede-h .ttl{display:flex;align-items:center;gap:4px;min-width:0}
.grip{cursor:grab;color:var(--muted);font-size:18px;line-height:1;padding:2px 4px;border-radius:4px;user-select:none;touch-action:none}
.grip:hover{background:color-mix(in srgb,var(--sc) 20%,var(--panel));color:var(--ink)}
.sede.over{outline:2px dashed var(--sc);outline-offset:2px}
.sede.moving{opacity:.45}

.sede-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sede-h h3{font-size:21px}
.metric{display:flex;flex-direction:column;gap:5px}
.metric .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.metric .row b{font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:600}
.metric .row b small{font-size:14px;color:var(--muted);font-weight:500}
.sede .foot{font-size:13px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sede .foot b{color:var(--ink)}
.legend-note{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend-note u{display:inline-block;width:2px;height:14px;background:var(--target)}

/* gráficos */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}
.chart{padding:14px 16px 10px;min-width:0;position:relative}
.chart-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:6px}
.chart-h p{margin:0;font-size:13px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{fill:var(--muted);font:12px var(--f-body)}
.chart .grid line{stroke:var(--line-soft)}
.insight{margin:10px 0 2px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.45;color:var(--ink);text-wrap:pretty}
.keys{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:7px 10px;border-radius:6px;white-space:nowrap;z-index:3;line-height:1.35}
.tip b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px/1 var(--f-body);padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* tabla tipo Excel */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.mx{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px;font-variant-numeric:tabular-nums}
table.mx th,table.mx td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
table.mx thead th{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel);position:sticky;top:0}
table.mx thead th.sede-name{text-align:left;font:700 18px var(--f-display);color:var(--ink);letter-spacing:.03em}
table.mx th[scope="row"]{text-align:left;font-weight:500;color:var(--muted);position:sticky;left:0;background:var(--panel);min-width:170px}
table.mx tr.real th[scope="row"]{color:var(--ink);font-weight:600}
table.mx tr.real td{background:var(--accent-soft)}
table.mx td.tot,table.mx th.tot{font-weight:600;border-left:1px solid var(--line)}
table.mx td.cur,table.mx th.cur{box-shadow:inset 1px 0 0 var(--target),inset -1px 0 0 var(--target)}
table.mx td.p-ok{color:var(--ok);font-weight:600} table.mx td.p-warn{color:var(--warn);font-weight:600} table.mx td.p-bad{color:var(--bad);font-weight:600}
table.mx td.na{color:var(--line)}
table.mx input{width:64px;font:inherit;text-align:right;padding:3px 5px;border:1px solid var(--accent);border-radius:4px;background:var(--panel);color:var(--ink)}
.tbl-stack{display:flex;flex-direction:column;gap:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}

/* carga */
.drop{border:2px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--panel);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-family:var(--f-display);font-size:22px;font-weight:600}
.drop p{margin:0;color:var(--muted);font-size:14px;max-width:56ch}
.btn{font:600 14px/1 var(--f-body);border-radius:7px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.step{padding:18px;display:flex;flex-direction:column;gap:14px}
.step-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step-h .n{font:700 14px var(--f-display);color:var(--accent);letter-spacing:.06em}
.step p.help{margin:0;color:var(--muted);font-size:14px;max-width:75ch}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type="text"]{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);max-width:100%}
.maplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.maprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:7px;min-width:0}
.maprow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.maprow small{color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.note{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.hist{display:flex;flex-direction:column}
.help-top{margin:0 0 14px;color:var(--muted);font-size:14px}
.fixed{padding:8px 10px;border:1px dashed var(--line);border-radius:7px;font-size:14px;color:var(--muted)}
.step{margin-bottom:12px}
.hist div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px;flex-wrap:wrap}
.hist small{color:var(--muted)}
.state{padding:60px 16px;text-align:center;color:var(--muted)}
@media (max-width:640px){.kpi .big{font-size:34px}.brand h1{font-size:22px}nav.tabs{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
/* ---- estética ITCA ---- */
header.top{background:#010733;border-bottom:1px solid var(--line)}
body::before{background:#010733}
.brand h1{font:900 30px/1 var(--f-display);letter-spacing:-.01em}
.brand h1 .hl{display:inline-block;background:var(--accent);color:var(--navy);padding:2px 10px 4px;margin-left:4px;transform:rotate(-1.5deg);border-radius:3px 9px 4px 10px;box-shadow:3px 2px 0 rgba(62,227,154,.35)}
h2{font-family:var(--f-display);font-weight:800;letter-spacing:.02em}
h3,.sede-h h3,.s-name h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em}
.s-name h3{font-size:19px;text-transform:uppercase}
nav.tabs a{font:700 15px/1 var(--f-body);letter-spacing:.08em;border:2px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;box-shadow:none;padding:12px 26px}

  else if(pace<1){const esp=obj*pace,d=val-esp;if(d>=0){cls="ok";msg=`▲ ${fInt(d)} arriba del ritmo`}else{cls=val/esp>=.85?"warn":"bad";msg=`▼ ${fInt(-d)} abajo del ritmo`}sub=`A hoy debería llevar ${fInt(esp)}`}
  else{const d=val-obj;if(d>=0){cls="ok";msg=`▲ Superó el objetivo por ${fInt(d)}`}else{cls="bad";msg=`▼ Faltaron ${fInt(-d)}`}}
  return `<div class="gauge">${svg}<div class="gtxt"><div class="glbl">${lbl}</div><div class="gval num"><b>${fInt(val)}</b> <span>de ${fInt(obj)}</span></div><div class="gmsg ${cls}">${msg}</div>${sub?`<div class="gsub">${sub}</div>`:""}</div></div>`}
function renderMonths(){const el=$("#months");const ix=selIdx();

    <div class="kpi panel"><div class="lbl">Conversión</div><div class="big num">${fConv(t.convReal)}</div><div class="sub">Estimada: <b>${fConv(t.convEst)}</b></div></div>
    <div class="kpi panel"><div class="lbl">Mejor mes en ventas</div><div class="big num">${best?MESES[best.k].lbl:"—"}<span>${best?" "+fPct(best.a):""}</span></div><div class="sub">${worst&&worst.k!==best.k?`Más bajo: <b>${MESES[worst.k].lbl} · ${fPct(worst.a)}</b>${MESES[worst.k].key===todayKey?" (mes en curso)":""}`:"Elegí meses con datos para comparar"}</div></div>

  let prevV=null;

  const a=aggSel(S.sedeSel,ix);

  const metNom=S.metric==="datos"?"datos":"ventas";
  const heatRow=(s,n)=>{const cells=ix.map(k=>{const c=calc(s,k),p=paceOf(k),v=S.metric==="datos"?c.alcD:c.alcV,st=status(v,p);

  const metSeg=`<div class="seg" role="group" aria-label="Métrica"><button type="button" data-metric="ventas" aria-pressed="${S.metric==="ventas"}">Ventas</button><button type="button" data-metric="datos" aria-pressed="${S.metric==="datos"}">Datos</button></div>`;

    <div class="chart panel" id="ch-cd"><div class="chart-h"><h3>Datos</h3><p>Deseados vs. brindados</p></div><div class="cv"></div><div class="keys"><span><i style="background:var(--target-soft);border:1.5px solid var(--target)"></i>Deseados</span><span><i style="background:${SCOL(S.sedeSel)}"></i>Brindados</span></div></div>

    <div class="chart panel" id="ch-co"><div class="chart-h"><h3>Ritmo dentro del mes</h3>${metSeg}</div><p style="margin:0 0 4px;font-size:13px;color:var(--muted)">% del objetivo de ${metNom} acumulado día a día</p><div class="cv"></div><div class="keys" id="co-keys"></div></div>

function drawCompare(){const ix=selIdx(),sede=S.sedeSel;barsChart($("#ch-cv"),sede,ix,"ventas");barsChart($("#ch-cd"),sede,ix,"datos");convChart($("#ch-cc"),sede,ix);overlayChart($("#ch-co"),sede,ix,S.metric==="datos"?0:1);insightsCompare()}
function barsChart(box,sede,ix,kind){const col=SCOL(sede);const cv=box.querySelector(".cv");const w=Math.max(320,cv.clientWidth),h=240,L=44,R=8,T=18,B=26;

function convChart(box,sede,ix){const col=SCOL(sede);const cv=box.querySelector(".cv");const w=Math.max(320,cv.clientWidth),h=220,L=48,R=12,T=12,B=26;

function overlayChart(box,sede,ix,key){const cv=box.querySelector(".cv"),keys=box.querySelector("#co-keys");
  const series=[];ix.forEach(k=>{const m=MESES[k],doc=S.diario[m.key];if(!doc||!doc.dias)return;const c=calc(sede,k),target=key===0?c.des:c.objV;if(!target)return;

/* cuatrimestres del ciclo: Q1 ago–nov, Q2 dic–mar, Q3 abr–jul */
function bloqueQ(i){const q=Math.floor(i/4),ix=[q*4,q*4+1,q*4+2,q*4+3];const a=aggSel("TOTAL",ix);
  const v=a.ventas||0,f=Math.max(a.objV-v,0),rango=`${MESES[ix[0]].lbl}–${MESES[ix[3]].lbl}`;

function viewResumen(){
  const i=defaultMes(),m=MESES[i],pace=paceOf(i),t=calc("TOTAL",i);
  const stV=status(t.alcV,pace),stD=status(t.alcD,pace);
  const esActual=m.key===todayKey,quedan=esActual?m.days-today.getDate():0;
  const faltanV=t.objV-(t.ventas||0);
  const _p=esActual?`Al ${today.getDate()} de ${m.lbl} · ${Math.round(pace*100)}% del mes transcurrido`:pace>=1?`Mes cerrado`:`Mes por empezar`;
  const ml=MES_LARGO[m.lbl],stT=estadoSimple(t.ventas,t.objV,pace);
  const head=pace===0?`${ml[0].toUpperCase()+ml.slice(1)} todavía no empezó. La meta es vender <b>${fInt(t.objV)}</b>.`:t.ventas==null?`Todavía no hay ventas cargadas para ${ml}.`:pace>=1?`En ${ml} ITCA vendió <b>${fInt(t.ventas)}</b> de ${fInt(t.objV)}: ${t.ventas>=t.objV?"cumplió la meta":`le faltaron ${fInt(t.objV-t.ventas)}`}.`:`En ${ml} ITCA lleva <b>${fInt(t.ventas)}</b> ventas de ${fInt(t.objV)}. ${t.ventas>=t.objV?"Ya cumplió la meta.":`Le faltan <b>${fInt(t.objV-t.ventas)}</b>.`}`;
  const hoyTxt=(obj,val)=>pace===0?`Mes por empezar`:val==null?`Sin datos cargados`:val>=obj?`Meta cumplida`:`Faltan <b>${fInt(obj-val)}</b>`;
  let ritmo="";
  if(esActual){const pd=quedan>0?Math.max(faltanV,0)/quedan:0;
    ritmo=`<div class="kpi panel"><div class="lbl">Para llegar</div><div class="big num">${fInt(Math.max(faltanV,0))}<span> ventas</span></div><div class="sub">${faltanV>0?`para llegar a la meta de ${MES_LARGO[m.lbl]}`:`Meta del mes cumplida`}</div></div>`}
  const kpis=`<section><div class="headline ${stT.c}"><span class="s-badge ${stT.c}">${stT.t.replace("atrasada","atrasado")}</span><p>${head}</p></div>

  </div></details></section>`;
}

/* ---------- gráficos SVG ---------- */
function niceMax(v){if(!v||v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function svgFrame(w,h){return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`}
function tipOn(box,html,x,y){let t=box.querySelector(".tip");if(!t){t=document.createElement("div");t.className="tip";box.appendChild(t)}t.innerHTML=html;t.hidden=false;
  const bw=box.clientWidth,tw=t.offsetWidth;let l=x+12;if(l+tw>bw-4)l=x-tw-12;if(l<4)l=4;t.style.left=l+"px";t.style.top=Math.max(4,y-10)+"px"}
function tipOff(box){const t=box.querySelector(".tip");if(t)t.hidden=true}
function bindHover(box,svg,w,items){// items:[{x0,x1,html}]
  svg.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*w/r.width;const it=items.find(o=>sx>=o.x0&&sx<o.x1);
    if(!it){tipOff(box);return}const br=box.getBoundingClientRect();tipOn(box,it.html,e.clientX-br.left,e.clientY-br.top)});
  svg.addEventListener("pointerleave",()=>tipOff(box))}

function drawCharts(){

    const y=v=>T+(h-T-B)*(1-v/max),bw=(w-L-R)/12;let s=svgFrame(w,h)+`<g class="grid">`;

      s+=`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" style="${k===i?"fill:var(--ink);font-weight:600":""}">${r.m.lbl}</text>`;
      items.push({x0:x,x1:x+bw,html:`<b>${r.m.lbl} ${r.m.y}</b><br>Objetivo: ${fInt(r.c.objV)}<br>Logrado: ${fInt(r.c.ventas)}${r.c.alcV!=null?" ("+fPct(r.c.alcV)+")":""}`})});
    s+=`<line x1="${L}" x2="${w-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg>`;cv.innerHTML=s;bindHover(box,cv.querySelector("svg"),w,items)})();

  (function(){const box=$("#ch-dia"),cv=box.querySelector(".cv");const m=MESES[i],doc=S.diario[m.key];const key=S.metric==="datos"?0:1;

    const lastDay=m.key===todayKey?today.getDate():m.key<todayKey?m.days:0;const cum=[];let acc=0,maxDayData=0;
    for(let d=1;d<=m.days;d++){const day=doc.dias[String(d).padStart(2,"0")];if(day){maxDayData=d;let v=0;if(sede==="TOTAL"){for(const k in day)v+=day[k][key]||0}else v=(day[sede]||[0,0])[key]||0;acc+=v}cum.push(acc)}
    const upto=Math.max(maxDayData,Math.min(lastDay,m.days));
    const w=Math.max(320,cv.clientWidth),h=250,L=44,R=12,T=12,B=26;const max=niceMax(Math.max(target||0,acc));
    const x=d=>L+(w-L-R)*(d-1)/(m.days-1),y=v=>T+(h-T-B)*(1-v/max);let s=svgFrame(w,h)+`<g class="grid">`;
    for(let k=0;k<=4;k++){const v=max*k/4;s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fInt(v)}</text>`}s+="</g>";
    [1,5,10,15,20,25,m.days].forEach(d=>{s+=`<text x="${x(d)}" y="${h-8}" text-anchor="middle">${d}</text>`});
    if(target)s+=`<line x1="${x(1)}" y1="${y(target/m.days)}" x2="${x(m.days)}" y2="${y(target)}" stroke="var(--target)" stroke-width="2" stroke-dasharray="6 5"/>`;
    if(upto>0){let p="";for(let d=1;d<=upto;d++)p+=(d===1?"M":"L")+x(d).toFixed(1)+" "+y(cum[d-1]).toFixed(1);
      s+=`<path d="${p} L${x(upto)} ${y(0)} L${x(1)} ${y(0)} Z" fill="${col}" opacity=".14"/><path d="${p}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
      s+=`<circle cx="${x(upto)}" cy="${y(cum[upto-1])}" r="4.5" fill="${col}" stroke="var(--panel)" stroke-width="2"/><text x="${x(upto)}" y="${y(cum[upto-1])-10}" text-anchor="${upto>m.days*.8?"end":"middle"}" style="fill:var(--ink);font-weight:600">${fInt(cum[upto-1])}</text>`}
    s+=`<line x1="${L}" x2="${w-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/></svg>`;cv.innerHTML=s;
    const items=[];const step=(w-L-R)/(m.days-1);for(let d=1;d<=m.days;d++){const xc=x(d);items.push({x0:xc-step/2,x1:xc+step/2,html:`<b>${d} de ${m.lbl}</b><br>Acumulado: ${d<=upto?fInt(cum[d-1]):"—"}<br>Ritmo esperado: ${fInt(target*d/m.days)}`})}
    bindHover(box,cv.querySelector("svg"),w,items)})();

  // 3 conversión
  (function(){const box=$("#ch-conv"),cv=box.querySelector(".cv");const w=Math.max(320,cv.clientWidth),h=230,L=44,R=12,T=12,B=26;
    const rows=MESES.map((m,k)=>({m,c:calc(sede,k)}));const max=niceMax(Math.max(...rows.map(r=>Math.max(r.c.convEst||0,r.c.convReal||0)))*1.05);
    const bw=(w-L-R)/12,x=k=>L+bw*k+bw/2,y=v=>T+(h-T-B)*(1-v/max);let s=svgFrame(w,h)+`<g class="grid">`;
    for(let k=0;k<=4;k++){const v=max*k/4;s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fConv(v)}</text>`}s+="</g>";
    const line=(f,col,dash)=>{let p="",pts="";rows.forEach((r,k)=>{const v=f(r.c);if(v==null||!isFinite(v))return;p+=(p?"L":"M")+x(k).toFixed(1)+" "+y(v).toFixed(1);pts+=`<circle cx="${x(k)}" cy="${y(v)}" r="3.5" fill="${col}"/>`});return `<path d="${p}" fill="none" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="6 5"':""}/>`+pts};
    s+=line(c=>c.convEst,"var(--target)",true)+line(c=>c.convReal,col,false);
    rows.forEach((r,k)=>{s+=`<text x="${x(k)}" y="${h-8}" text-anchor="middle">${r.m.lbl}</text>`});s+="</svg>";cv.innerHTML=s;
    bindHover(box,cv.querySelector("svg"),w,rows.map((r,k)=>({x0:L+bw*k,x1:L+bw*(k+1),html:`<b>${r.m.lbl} ${r.m.y}</b><br>Estimada: ${fConv(r.c.convEst)}<br>Real: ${fConv(r.c.convReal)}`})))})();

  // 4 alcance por sede (barras horizontales)
  (function(){const box=$("#ch-sedes"),cv=box.querySelector(".cv");const pace=paceOf(i);const rows=SEDES.map(([s,n])=>({n,c:calc(s,i)}));
    const w=Math.max(320,cv.clientWidth),rh=30,T=6,L=124,R=48,h=T+rows.length*rh+22;const max=Math.max(1.2,...rows.map(r=>r.c.alcV||0));
    const x=v=>L+(w-L-R)*v/max;let s=svgFrame(w,h);
    [0,.5,1].forEach(v=>{s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${h-20}" stroke="var(--line-soft)"/><text x="${x(v)}" y="${h-4}" text-anchor="middle">${fPct(v)}</text>`});

    if(pace>0&&pace<1)s+=`<line x1="${x(pace)}" x2="${x(pace)}" y1="${T}" y2="${h-20}" stroke="var(--target)" stroke-width="2"/>`;

    s+="</svg>";cv.innerHTML=s;const svg=cv.querySelector("svg");
    svg.addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),sy=(e.clientY-r.top)*h/r.height;const it=items.find(o=>sy>=o.y0&&sy<o.y1);if(!it){tipOff(box);return}const br=box.getBoundingClientRect();tipOn(box,it.html,e.clientX-br.left,e.clientY-br.top)});
    svg.addEventListener("pointerleave",()=>tipOff(box))})();
  insightsSingle();
  drawAnterior();

/* ---------- pestaña Comparación: rango de fechas vs. el año pasado ---------- */
const CICLO_INI=new Date(MESES[0].y,MESES[0].m-1,1),CICLO_FIN=new Date(MESES[11].y,MESES[11].m-1,MESES[11].days);
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseD=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const fD=d=>`${d.getDate()}/${d.getMonth()+1}`;
const fDL=d=>`${d.getDate()} de ${MES_LARGO[MES_N[d.getMonth()]]}`;
function hoyD(){return new Date(today.getFullYear(),today.getMonth(),today.getDate())}
// último día con datos de este año: el último día cargado del mes en curso, o el fin del mes anterior
function ultimoDisponible(){const k=MES_IDX[todayKey];if(k==null)return CICLO_FIN;const u=ultimoCargado(todayKey);if(u)return new Date(today.getFullYear(),today.getMonth(),u);return new Date(today.getFullYear(),today.getMonth(),0)}
function atajo(t){const h=hoyD();let a,b=h;
  if(t==="7"){a=new Date(h);a.setDate(h.getDate()-6)}
  else if(t==="q"){const i=MES_IDX[todayKey]??0,q=Math.floor(i/4)*4;a=new Date(MESES[q].y,MESES[q].m-1,1)}
  else if(t==="ciclo")a=new Date(CICLO_INI);
  else a=new Date(h.getFullYear(),h.getMonth(),1);
  if(a<CICLO_INI)a=new Date(CICLO_INI);return{a,b,t}}
function rangoActual(){if(!S.rango2)S.rango2=atajo("mes");return S.rango2}
// parte el rango en tramos por mes y marca cuáles se pueden comparar
function tramos(a,b){const out=[];let d=new Date(a.getFullYear(),a.getMonth(),1);
  while(d<=b){const k=MES_IDX[d.getFullYear()+"_"+String(d.getMonth()+1).padStart(2,"0")];if(k!=null){const M=MESES[k];
      const d1=(a.getFullYear()===M.y&&a.getMonth()+1===M.m)?a.getDate():1,d2=(b.getFullYear()===M.y&&b.getMonth()+1===M.m)?b.getDate():M.days;
      const full=d1===1&&d2===M.days,diario=diasCargados(M.key).size>0;out.push({k,M,d1,d2,full,diario,ok:diario||full})}
    d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
function sumaDias(mk,sede,d1,d2){const dias=(S.diario[mk]||{}).dias||{};let s=0;for(let d=d1;d<=d2;d++){const day=dias[String(d).padStart(2,"0")];if(!day)continue;if(sede==="TOTAL"){for(const x in day)s+=day[x][1]||0}else s+=(day[sede]||[0,0])[1]||0}return s}
function curTramo(t,sede){if(t.full){const v=calc(sede,t.k).ventas;if(v!=null)return v;if(!t.diario)return null}return sumaDias(t.M.key,sede,t.d1,t.d2)}
function calcRango(sede){const{a,b}=rangoActual();const fin=new Date(Math.min(b,ultimoDisponible()));const ts=fin<a?[]:tramos(a,fin);
  let cur=0,prev=0;const fuera=[];for(const t of ts){if(!t.ok){fuera.push(t);continue}const c=curTramo(t,sede);if(c==null){fuera.push(t);continue}cur+=c;prev+=antMes(t.k,sede,t.d2)-antMes(t.k,sede,t.d1-1)}
  return{cur,prev,fin,ts,fuera}}
function viewComparacion(){
  const r=rangoActual(),corto=n=>n.replace(/^Sede /,"");
  const sedeBtns=[["TOTAL","Total ITCA"],...SEDES].map(([k,n])=>`<button type="button" data-sede="${k}" aria-pressed="${S.sedeSel===k}">${SW(k)}${corto(n)}</button>`).join("");
  const at=[["mes","Este mes"],["7","Últimos 7 días"],["q","Este cuatrimestre"],["ciclo","Todo el ciclo"]].map(([k,n])=>`<button type="button" data-cmpat="${k}" aria-pressed="${r.t===k}">${n}</button>`).join("");
  const nomSel=S.sedeSel==="TOTAL"?"Total ITCA":SEDE_NOMBRE[S.sedeSel],R=calcRango(S.sedeSel),vacio=R.fin<r.a;
  const d=R.cur-R.prev,pct=R.prev?Math.round(d/R.prev*100):null,cls=vacio?"":d>=0?"ok":"bad";
  const rangoTxt=vacio?"":(r.a.getTime()===R.fin.getTime()?`El ${fDL(r.a)}`:`Del ${fDL(r.a)} al ${fDL(R.fin)}`);
  const head=vacio?`Todavía no hay datos cargados para esas fechas.`:`${rangoTxt}: <b>${fInt(R.cur)}</b> ventas contra <b>${fInt(R.prev)}</b> del año pasado en las mismas fechas (${pct==null?"—":(d>=0?"+":"")+pct+"%"}).`;
  const avisos=[];if(!vacio&&r.b>R.fin)avisos.push(`Este año hay datos cargados hasta el ${fDL(R.fin)}, así que se compara hasta esa fecha.`);
  if(R.fuera.length)avisos.push(`${R.fuera.map(t=>MES_LARGO[t.M.lbl]).join(", ")} no ${R.fuera.length>1?"tienen":"tiene"} carga día por día: solo se puede comparar el mes completo, así que esos días quedaron afuera.`);
  const filas=[...SEDES,["TOTAL","Total ITCA"]].map(([s,n])=>{const x=calcRango(s),dd=x.cur-x.prev,p=x.prev?Math.round(dd/x.prev*100):null;
    return `<tr class="sc${s==="TOTAL"?" bw":""}" style="--sc:${SCOL(s)}"><th scope="row">${SW(s)}${esc(n)}</th><td><b>${fInt(x.cur)}</b></td><td>${fInt(x.prev)}</td><td class="${dd>=0?"h-ok":"h-bad"}">${dd>0?"+":""}${fInt(dd)}</td><td class="${dd>=0?"h-ok":"h-bad"}">${p==null?"—":(dd>=0?"+":"")+p+"%"}</td></tr>`}).join("");
  return `<section><div class="sec-head"><h2>Comparación con el año pasado</h2></div>
    <div class="step panel cmp-ctrl"><div class="fields">
      <div class="field"><label for="cmp-desde">Desde</label><input type="date" id="cmp-desde" data-cmp="a" value="${isoD(r.a)}" min="${isoD(CICLO_INI)}" max="${isoD(CICLO_FIN)}"></div>
      <div class="field"><label for="cmp-hasta">Hasta</label><input type="date" id="cmp-hasta" data-cmp="b" value="${isoD(r.b)}" min="${isoD(CICLO_INI)}" max="${isoD(CICLO_FIN)}"></div></div>
      <div class="seg" role="group" aria-label="Atajos">${at}</div></div>
    <div class="headline ${cls}"><span class="s-badge ${cls}">${vacio?"Sin datos":d>=0?"Arriba":"Abajo"}</span><p>${esc(nomSel)} · ${head}</p></div>
    ${avisos.length?`<p class="note" style="margin:0 0 14px">${avisos.join(" ")}</p>`:""}
    <div class="toolbar"><div class="seg" role="group" aria-label="Sede">${sedeBtns}</div></div>
    <div class="charts"><div class="chart panel" id="ch-rango"><div class="chart-h"><h3>Ventas acumuladas en el rango · ${esc(nomSel)}</h3></div><div class="cv"></div>
      <div class="keys"><span><i style="background:${SCOL(S.sedeSel)}"></i>Este año</span><span><i style="background:var(--muted)"></i>Año pasado, mismas fechas</span></div></div></div></section>
  <section><div class="sec-head"><h2>Por sede · mismas fechas</h2></div><div class="tbl-wrap"><table class="mx heat" style="min-width:560px"><thead><tr><th scope="col" style="text-align:left">Sede</th><th scope="col">Este año</th><th scope="col">Año pasado</th><th scope="col">Diferencia</th><th scope="col">%</th></tr></thead><tbody>${filas}</tbody></table></div></section>
  <section><div class="sec-head"><h2>Todo el ciclo, mes por mes · ${esc(nomSel)}</h2></div><div class="charts"><div class="chart panel" id="ch-ant-mes"><div class="chart-h"><h3>Ventas por mes · este año vs. año pasado</h3></div><div class="cv"></div>

function distinct(U,col){const m=new Map();for(const r of U.rows){const v=String(r[col]??"").trim();m.set(v,(m.get(v)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function parseDate(v){
  if(v==null||v==="")return null;
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v==="number"){const p=XLSX.SSF.parse_date_code(v);return p?new Date(p.y,p.m-1,p.d,p.H||0,p.M||0):null}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null}
function mkey(d){return d.getFullYear()+"_"+String(d.getMonth()+1).padStart(2,"0")}
function hasVenta(U){return true}
function periodo(){const pm=S.perMes!=null?S.perMes:baseMes(),M=MESES[pm];const def=M.key===todayKey?today.getDate():M.key<todayKey?M.days:1;return{pm,M,hasta:Math.min(S.perHasta||def,M.days)}}

/* Formato fijo del "Resumen de Acciones Comerciales" de Tecnom:
   columna A = equipo/sede, "Total" (procesos comerciales nuevos) = datos, "Vendidos" = ventas.
   ITCA ONLINE, SEDE MOSCONI y la fila Total no se toman. */
function parseResumen(U,wb){
  for(const name of wb.SheetNames){const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
    let hr=-1,cV=-1,cD=-1;
    for(let r=0;r<Math.min(aoa.length,15)&&hr<0;r++){const row=aoa[r]||[];const iv=row.findIndex(c=>/^vendidos/.test(norm(c)));if(iv>=0){hr=r;cV=iv;cD=row.findIndex(c=>/^total/.test(norm(c)))}}
    if(hr<0||cD<0)continue;
    const out={},ign=[];
    for(let r=hr+1;r<aoa.length;r++){const row=aoa[r]||[];const lbl=String(row[0]??"").replace(/-->/g,"").trim();const n=norm(lbl);if(!n||n==="total")continue;
      if(/no lo tomas|online|mosconi/.test(n)){ign.push(lbl.replace(/\(.*\)/,"").trim());continue}
      let hit="";for(const[k,al]of Object.entries(ALIAS))if(al.some(a=>n.includes(a))){hit=k;break}
      if(!hit){if(typeof row[cD]==="number")ign.push(lbl);continue}
      const d=Number(row[cD])||0,v=Number(row[cV])||0;out[hit]=out[hit]?{datos:out[hit].datos+d,ventas:out[hit].ventas+v}:{datos:d,ventas:v}}
    if(Object.keys(out).length){U.s=out;U.ignored=ign;U.ok=true;return}}
  U.ok=false}
function guessCol(headers,re){const k=headers.findIndex(h=>re.test(norm(h)));return k<0?"":k}
function loadSheet(U,name){const ws=U.wb.Sheets[name];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  let hi=0;for(let k=0;k<Math.min(20,aoa.length);k++){if((aoa[k]||[]).filter(c=>typeof c==="string"&&c.trim()).length>=3){hi=k;break}}
  U.sheet=name;U.headers=(aoa[hi]||[]).map(h=>h==null?"":String(h).trim());U.rows=aoa.slice(hi+1).filter(r=>r&&r.some(c=>c!=null&&c!==""));
  const cfg=S.config||{};const byName=n=>{if(!n)return"";const k=U.headers.findIndex(h=>norm(h)===norm(n));return k<0?"":k};
  U.colSede=byName(cfg.colSede);if(U.colSede==="")U.colSede=guessCol(U.headers,/sede|sucursal|filial|punto de venta|concesionari|tienda/);
  U.colVenta=byName(cfg.colVenta);if(U.colVenta==="")U.colVenta=guessCol(U.headers,/estado|etapa|status|resultado|venta/);
  U.mapSede={...(cfg.mapSede||{})};autoMapSede(U);
  U.ventaVals=cfg.ventaVals?[...cfg.ventaVals]:[];if(!cfg.ventaVals)autoVenta(U);
  U.selMeses={}}
function autoMapSede(U){if(U.colSede==="")return;for(const[v]of distinct(U,U.colSede)){const n=norm(v);if(U.mapSede[n]!==undefined)continue;
  let hit="";for(const[k,al]of Object.entries(ALIAS))if(al.some(a=>n.includes(a))){hit=k;break}U.mapSede[n]=hit}}
function autoVenta(U){if(U.colVenta==="")return;for(const[v]of distinct(U,U.colVenta)){const n=norm(v);if(/vendid|venta|ganad|inscript|matricul|cerrad|concretad/.test(n)&&!/no |perdid|sin /.test(n))U.ventaVals.push(n)}}

async function guardar(){
  const U=S.up;if(!U)return;const res=compute(U);const{M,hasta}=periodo();const mk=M.key,dd=String(hasta).padStart(2,"0");

    real.actualizado={at:new Date().toISOString(),archivo:U.fileName,mes:mk,hasta};
    // cortes acumulados por día: total del 1 al "hasta"; el día a día sale por diferencia
    const prevDoc=est.diario[mk]||{};const cortes=prevDoc.cortes||{};
    for(const d in cortes){if(+d>hasta)for(const k of res.sedesIn)delete cortes[d][k]}
    cortes[dd]=cortes[dd]||{};for(const k of res.sedesIn)cortes[dd][k]=[res.s[k].datos,res.s[k].ventas];
    const dias={};const all=new Set();for(const d in cortes)for(const k in cortes[d])all.add(k);
    for(const k of all){let last=[0,0];Object.keys(cortes).sort().forEach(d=>{const c=cortes[d][k];if(!c)return;dias[d]=dias[d]||{};dias[d][k]=[Math.max(0,c[0]-last[0]),Math.max(0,c[1]-last[1])];last=c})}

    S.up=null;S.msg={c:"ok",t:`Listo: se actualizó ${MES_LARGO[M.lbl]} hasta el ${hasta}.`}}

/* ---------- respaldo: historial de versiones y descarga en Excel ---------- */
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,usuario:S.cred&&S.cred.u,clave:S.cred&&S.cred.p})});const j=await r.json().catch(()=>({}));if(r.status===401){salir();throw{code:"not_writer"}}if(!r.ok)throw{code:"error"};return j}
async function cargarHistorial(){S.hist="cargando";try{const j=await api({accion:"historial"});S.hist=j.historial||[];S.histActual=j.actual}catch(e){S.hist=[];S.msg={c:"bad",t:errGuardar(e)}}if(S.view==="respaldo")render()}
function viewRespaldo(){
  if(!puedeEditar())return `<section><div class="state">Solo los analistas de Marketing pueden ver el respaldo. Tocá <b>Ingresar</b> arriba.</div></section>`;
  if(S.hist==null)setTimeout(cargarHistorial,0);
  const fmt=iso=>new Date(iso).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"});
  const lista=S.hist==null||S.hist==="cargando"?`<p class="help">Cargando el historial…</p>`:!S.hist.length?`<p class="help">Todavía no hay versiones guardadas. Se van a ir guardando cada vez que alguien cargue un reporte o corrija un dato.</p>`:
    `<div class="hist">${S.hist.map((x,k)=>`<div><span><b>${fmt(x.at)}</b> · ${esc(x.por)}<br><small>${esc(x.nota||"")}</small></span><span class="row-btns">${x.v===S.histActual?`<span class="chip ok">Versión actual</span>`:`<button type="button" class="btn" data-restaurar="${x.v}" ${S.saving?"disabled":""}>${S.confirmRest===x.v?"Tocá de nuevo para confirmar":"Volver a esta versión"}</button>`}</span></div>`).join("")}</div>`;
  return `<section><div class="sec-head"><h2>Respaldo</h2></div>
    ${S.msg?`<p class="note ${S.msg.c}">${esc(S.msg.t)}</p>`:""}
    <div class="step panel"><div class="step-h"><h3>Descargar todos los datos</h3></div><p class="help">Baja un Excel con la hoja de Objetivos 2027 por sede, el detalle día por día y el historial de cargas. Conviene guardarlo en el Drive de vez en cuando.</p>
      <div><button type="button" class="btn primary" data-action="excel">Descargar respaldo en Excel</button></div></div>
    <div class="step panel"><div class="step-h"><h3>Versiones guardadas</h3></div><p class="help">Cada vez que alguien guarda, queda una copia. Si se cargó algo mal, podés volver a una versión anterior: la versión de ahora también queda guardada, así que no se pierde nada.</p>${lista}</div></section>`}
async function restaurar(v){S.saving=true;S.confirmRest=null;render();
  try{const j=await api({accion:"restaurar",version:v});aplicarEstado(j.estado,j.version);S.msg={c:"ok",t:"Listo: se volvió a esa versión. Ya lo ven todos."};S.hist=null}catch(e){S.msg={c:"bad",t:errGuardar(e)}}
  S.saving=false;render()}
function descargarExcel(){
  if(!window.XLSX){S.msg={c:"bad",t:"No se pudo cargar el generador de Excel. Volvé a abrir la página."};render();return}
  const wb=XLSX.utils.book_new();const ix=MESES.map((m,k)=>k);
  // hoja Objetivos 2027, igual que el Excel original
  const filas=[["SEDE","",...MESES.map(m=>m.lbl+" "+String(m.y).slice(2)),"TOTAL"]];
  const r1=v=>v==null||!isFinite(v)?"":Math.round(v*100)/100,pc=v=>v==null||!isFinite(v)?"":Math.round(v*1000)/1000;
  for(const[s,n]of[...SEDES,["TOTAL","TOTAL ITCA"]]){const cs=ix.map(k=>calc(s,k)),a=aggSel(s,ix);
    const fila=(lbl,f,fmt)=>[lbl===filas.length?"":"",lbl,...cs.map(c=>fmt(f(c))),fmt(f(a))];
    const bloque=[["Datos deseados",c=>c.des,r1],["Datos brindados",c=>c.datos,r1],["% alcance datos",c=>c.alcD,pc],["Objetivo ventas",c=>c.objV,r1],["Ventas logrado",c=>c.ventas,r1],["% alcance de ventas",c=>c.alcV,pc],["Conversión estimada",c=>c.convEst,pc],["Conversión real",c=>c.convReal,pc]];
    bloque.forEach(([l,f,fm],k)=>filas.push([k===0?n:"",l,...cs.map(c=>fm(f(c))),fm(f(a))]));filas.push([])}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(filas),"Objetivos 2027");
  // detalle por día
  const dia=[["Fecha","Sede","Datos del día","Ventas del día","Datos acumulados","Ventas acumuladas"]];
  for(const mk of Object.keys(S.diario||{}).sort()){const M=MESES[MES_IDX[mk]];if(!M)continue;const d=S.diario[mk]||{},dias=d.dias||{},cortes=d.cortes||{};
    for(const dd of Object.keys(dias).sort())for(const[s,n]of SEDES){const v=dias[dd][s];if(!v)continue;const c=(cortes[dd]||{})[s]||["",""];dia.push([`${+dd}/${M.m}/${M.y}`,n,v[0],v[1],c[0],c[1]])}}
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dia),"Por día");
  const cg=[["Fecha de carga","Archivo","Mes","Hasta el día"]];(S.cargas||[]).forEach(c=>cg.push([new Date(c.at).toLocaleString("es-AR"),c.archivo,(c.meses||[]).map(k=>MES_LARGO[MESES[MES_IDX[k]]?.lbl]||k).join(", "),c.hasta||""]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cg),"Cargas");
  const hoy=new Date();XLSX.writeFile(wb,`Respaldo Objetivos 2027 ITCA ${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,"0")}-${String(hoy.getDate()).padStart(2,"0")}.xlsx`)}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  if((S.calOpen||S.diaOpen)&&!e.target.closest(".hasta-dd")){S.calOpen=false;S.diaOpen=false;render()}
  const t=e.target.closest("[data-cmpat],[data-restaurar],[data-upw],[data-ucancel],[data-udel],[data-diaopen],[data-diasel],[data-gocargar],[data-calopen],[data-hasta],[data-tmodo],[data-scroll],[data-mes],[data-todos],[data-more],[data-sede],[data-metric],[data-tsede],[data-action]");if(!t)return;
  if(t.dataset.hasta!=null){S.perHasta=+t.dataset.hasta;S.calOpen=false;render();return}
  if(t.dataset.diasel!=null){const[w,d]=t.dataset.diasel.split("|");const mk=MESES[defaultMes()].key;const cur=S.rango&&S.rango.mk===mk?S.rango:null;const M=MESES[defaultMes()];const base=cur||(()=>{const c=[...diasCargados(mk)].sort((a,b)=>b-a)[0]||Math.max(ultimoDia(M),1);return{mk,desde:c,hasta:c}})();
    S.rango={...base,[w]:+d};if(w==="desde"&&S.rango.hasta<S.rango.desde)S.rango.hasta=+d;if(w==="hasta"&&S.rango.desde>S.rango.hasta)S.rango.desde=+d;S.diaOpen=false;render();return}
  if(t.dataset.cmpat!=null){S.rango2=atajo(t.dataset.cmpat);render();return}
  if(t.dataset.restaurar!=null){const v=t.dataset.restaurar;if(S.confirmRest!==v){S.confirmRest=v;render();return}restaurar(v);return}
  if(t.dataset.action==="excel"){descargarExcel();return}
  if(t.dataset.upw!=null){S.editUser=t.dataset.upw;S.msg=null;render();return}
  if(t.dataset.ucancel!=null){S.editUser=null;render();return}
  if(t.dataset.udel!=null){const u=t.dataset.udel;if(S.confirmDel!==u){S.confirmDel=u;S.msg={c:"",t:`Tocá "Borrar" de nuevo para confirmar que querés borrar a ${u}.`};render();return}S.confirmDel=null;guardarUsuarios((S.usuarios||[]).filter(z=>z.u!==u),`Usuario ${u} borrado.`);return}
  if(t.dataset.action==="login"){if(S.logged){salir();S.msg=null;if(S.view==="cargar")location.hash="#resumen";render()}else{S.loginOpen=true;S.loginMsg=null;renderModal()}return}
  if(t.dataset.action==="login-cancel"){S.loginOpen=false;renderModal();return}
  if(t.dataset.diaopen!=null){S.diaOpen=S.diaOpen===t.dataset.diaopen?false:t.dataset.diaopen;render();return}
  if(t.dataset.gocargar!=null){S.perMes=defaultMes();S.perHasta=+t.dataset.gocargar;return}
  if(t.dataset.calopen!=null){S.calOpen=!S.calOpen;render();return}
  if(t.dataset.tmodo!=null){S.tablaModo=t.dataset.tmodo;render();return}
  if(t.dataset.scroll!=null){const st=$("#sedes");if(st)st.scrollBy({left:+t.dataset.scroll*(st.clientWidth*.8),behavior:"smooth"});return}
  if(t.dataset.more!=null){S.showFut=!S.showFut;render();return}
  if(t.dataset.todos!=null){S.sel=selIdx().length===12?[baseMes()]:MESES.map((m,k)=>k);render()}
  else if(t.dataset.mes!=null){const k=+t.dataset.mes,cur=selIdx();
    if(cur.length===12)S.sel=[k];else if(cur.includes(k)){if(cur.length>1)S.sel=cur.filter(x=>x!==k)}else S.sel=[...cur,k].sort((a,b)=>a-b);render()}
  else if(t.dataset.sede){S.sedeSel=t.dataset.sede;render()}
  else if(t.dataset.metric){S.metric=t.dataset.metric;render()}
  else if(t.dataset.tsede){S.tablaSede=t.dataset.tsede;render()}
  else if(t.dataset.action==="editar"){if(S.editar)terminarEdicion();else{S.editar=true;S.msg=null;render()}}
  else if(t.dataset.action==="guardar")guardar()});
document.addEventListener("submit",async e=>{
  if(e.target.id==="login-form"){e.preventDefault();const u=$("#lg-u").value.trim(),pw=$("#lg-p").value;S.checking=true;S.loginMsg=null;renderModal();
    let ok=null;try{ok=await verificar(u,pw)}catch(err){ok=null}S.checking=false;
    if(!ok){S.loginMsg="Usuario o contraseña incorrectos.";renderModal();const f=$("#lg-u");if(f)f.value=u;return}
    S.logged=ok;S.cred={u:ok,p:pw};S.canWrite=true;S.loginOpen=false;S.loginMsg=null;try{sessionStorage.setItem("cred",JSON.stringify(S.cred))}catch(err){}
    S.msg=null;render();return}
  if(e.target.id==="user-form"){e.preventDefault();const p1=$("#nu-p").value,p2=$("#nu-p2").value;
    if(p1!==p2){S.msg={c:"bad",t:"Las contraseñas no coinciden."};render();return}if(p1.length<6){S.msg={c:"bad",t:"La contraseña tiene que tener al menos 6 caracteres."};render();return}
    const lista=JSON.parse(JSON.stringify(S.usuarios||[]));const sal=nuevaSal(),h=await hashPw(p1,sal);
    if(S.editUser){const x=lista.find(z=>z.u===S.editUser);if(x){x.s=sal;x.h=h}guardarUsuarios(lista,`Contraseña de ${S.editUser} actualizada.`)}
    else{const u=$("#nu-u").value.trim();if(!u){return}if(lista.some(z=>norm(z.u)===norm(u))){S.msg={c:"bad",t:"Ese usuario ya existe."};render();return}lista.push({u,s:sal,h});guardarUsuarios(lista,`Usuario ${u} creado.`)}}});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.cmp){const r=rangoActual(),v=parseD(e.target.value);if(v){let a=e.target.dataset.cmp==="a"?v:r.a,b=e.target.dataset.cmp==="b"?v:r.b;if(a>b){const z=a;a=b;b=z}if(a<CICLO_INI)a=new Date(CICLO_INI);if(b>CICLO_FIN)b=new Date(CICLO_FIN);S.rango2={a,b,t:null};render()}return}const t=e.target;const U=S.up;
  if(t.dataset.per){if(t.dataset.per==="mes"){S.perMes=+t.value;S.perHasta=null}else S.perHasta=+t.value;render();return}
  if(t.id==="file"&&t.files[0])readFile(t.files[0]);
  else if(t.dataset.edit)editCell(t);
  else if(U&&t.dataset.up==="hoja"){loadSheet(U,t.value);render()}
  else if(U&&t.dataset.up){const k=t.dataset.up;U[k]=t.value===""?"":+t.value;if(k==="colSede")autoMapSede(U);if(k==="colVenta"){U.ventaVals=[];autoVenta(U)}render()}
  else if(U&&t.dataset.mapsede!=null){U.mapSede[t.dataset.mapsede]=t.value;render()}
  else if(U&&t.dataset.venta!=null){const v=t.dataset.venta;U.ventaVals=t.checked?[...new Set([...U.ventaVals,v])]:U.ventaVals.filter(x=>x!==v);render()}
  else if(U&&t.dataset.selmes){U.selMeses[t.dataset.selmes]=t.checked;render()}});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f)}});
function route(){const h=(location.hash||"").slice(1);S.view=["resumen","tabla","comparacion","cargar","respaldo"].includes(h)?h:"resumen";if(S.view==="respaldo")S.hist=null;S.msg=null;render()}
window.addEventListener("hashchange",route);
document.addEventListener("toggle",e=>{if(e.target.id==="more-charts"){S.moreCharts=e.target.open;if(e.target.open)drawCharts()}},true);
let rw=0;new ResizeObserver(()=>{const w=document.body.clientWidth;if(Math.abs(w-rw)>20&&S.view==="resumen"&&S.obj){rw=w;selIdx().length>1?drawCompare():drawCharts()}}).observe(document.body);
/* orden y arrastre de las tarjetas de sede */
function ordenSedes(){let o=null;try{o=JSON.parse(localStorage.getItem("orden-sedes")||"null")}catch(e){}
  if(!Array.isArray(o))o=[];const keys=SEDES.map(x=>x[0]);o=o.filter(k=>keys.includes(k));keys.forEach(k=>{if(!o.includes(k))o.push(k)});return o.map(k=>[k,SEDE_NOMBRE[k]])}
function guardarOrden(o){try{localStorage.setItem("orden-sedes",JSON.stringify(o))}catch(e){}}
let DS=null,DR=null;
document.addEventListener("pointerdown",e=>{const g=e.target.closest(".grip");
  if(g){const card=g.closest(".sede");DR={key:card.dataset.sedecard,card,id:e.pointerId};card.classList.add("moving");e.preventDefault();return}
});
document.addEventListener("pointermove",e=>{
  if(DR){document.querySelectorAll(".sede.over").forEach(c=>c.classList.remove("over"));const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest(".sede");if(c&&c!==DR.card)c.classList.add("over");
    if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-60)window.scrollBy(0,14);return}
  if(!DS)return;const dx=e.clientX-DS.x;if(!DS.moved&&Math.abs(dx)>5){DS.moved=true;DS.el.classList.add("dragging")}if(DS.moved)DS.el.scrollLeft=DS.sl-dx});
function finDrag(e){
  if(DR){const el=e&&document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest(".sede");document.querySelectorAll(".sede.over,.sede.moving").forEach(x=>x.classList.remove("over","moving"));
    if(c&&c.dataset.sedecard&&c.dataset.sedecard!==DR.key){const o=ordenSedes().map(x=>x[0]);const from=o.indexOf(DR.key),to=o.indexOf(c.dataset.sedecard);o.splice(from,1);o.splice(to,0,DR.key);guardarOrden(o);DR=null;render();return}DR=null}
  if(DS){DS.el.classList.remove("dragging");DS=null}}
document.addEventListener("pointerup",finDrag);document.addEventListener("pointercancel",()=>finDrag(null));
try{const e=JSON.parse(document.getElementById("estado").textContent);S.obj=e.obj||null;S.real=e.real||null;S.diario=e.diario||{};S.cargas=e.cargas||[];S.usuarios=e.usuarios||[]}catch(err){}
try{const c=JSON.parse(sessionStorage.getItem("cred")||"null");if(c&&c.u){S.cred=c;S.logged=c.u;S.canWrite=true}}catch(err){}
S.loaded={obj:true,real:true};S.status="ok";
route();
function tick(){const d=new Date(),el=document.getElementById("clock");if(!el)return;const f=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});el.textContent=f.charAt(0).toUpperCase()+f.slice(1)+" · "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit",hour12:false})+" hs"}
tick();setInterval(tick,15000);

/* ---------- datos desde el servidor de Netlify ---------- */
traerDatos();setInterval(traerDatos,120000);
})();
</script>
